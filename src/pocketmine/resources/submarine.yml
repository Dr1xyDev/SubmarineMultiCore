# Submarine 2.0

network:
  packet-limit: 300
  port-checking: true

query:
  server-name: "Submarine"
  visible-plugins: false
  visible-players: false
  visible-map: true

player:
  # Keep player's inventory if they die
  keep-inventory: false
  # Keep player's experience if they die
  keep-experience: false
  nickname:
    delete-spaces: true
    replace-spaces: "_"

level:
  # If enabled, mobs can move around
  # Note: this feature can cause lag in your server when lots of mob are spawned
  enable-mob-ai: true
  # Generic Auto Mob Spawning, enable if you want spawn mobs in your world
  generic-auto-mob-spawning: true

dimensions:
  # Choose if the nether is allowed. The level of nether will generate automatically
  nether:
    active: true
    level-name: "nether"
  the-end:
    active: true
    level-name: "end"

developer:
  # This setting allows the server to load plugins through the source directory over a .phar file
  folder-plugin-loader: false
  # This setting allows to disable the internal server error kick
  internal-server-error-kick: false

additional-plugin-dirs:
# Example:
# - plugins2/

general:
  # This setting allows to customize the unknown command message
  custom-unknown-command-message:
    enabled: false
    message: "§cThis command was not found!"
  command-fix: false

resource-pack:
  #Minimum protocol for Bedrock resource pack
  minimal-bedrock-protocol: 370